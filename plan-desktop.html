<style>
*{box-sizing:border-box}
:root{--g:linear-gradient(135deg,#4000f3,#e65afc);--ink:#230835;--mut:#6d6782;--line:#ece6f8;--acc:#5a1fe0;--ok:#16a34a}
body{margin:0;background:#f7f5fb;color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:28px 20px 80px}
.top{display:flex;justify-content:space-between;align-items:center}.top img{height:26px}.top span{font-size:13px;color:var(--mut)}
h1{font-size:38px;letter-spacing:-.03em;margin:18px 0 6px}
.intro{color:var(--mut);margin:0 0 10px;max-width:760px;line-height:1.55}
.tabs{position:sticky;top:0;z-index:20;display:flex;gap:8px;padding:10px 0;background:#f7f5fb}
.tabs a{text-decoration:none;font-weight:800;font-size:14px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:999px;padding:10px 16px}
.opt{margin-top:40px;scroll-margin-top:70px}
.oh{display:flex;align-items:center;gap:12px}.oh span{font-size:12px;font-weight:800;letter-spacing:.14em;color:#fff;background:var(--g);border-radius:999px;padding:6px 12px}.oh h2{margin:0;font-size:26px}
.why{color:var(--mut);margin:8px 0 18px;max-width:820px;line-height:1.55}
table{width:100%;border-collapse:separate;border-spacing:0}
th,td{text-align:center;padding:14px 12px;font-size:15px}
td.l{text-align:left;font-weight:600;white-space:nowrap}
.l i.ic{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;margin-right:10px;vertical-align:middle}
.l i.ic svg{width:17px;height:17px;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.yes{font-weight:800}
.pn{font-size:20px;font-weight:800;margin:0}.was{font-size:14px;text-decoration:line-through}.pr{font-size:36px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.1em;border-radius:999px;padding:5px 10px;margin-bottom:8px}
.btn{display:inline-flex;justify-content:center;width:100%;max-width:190px;border:0;border-radius:999px;font:800 15px Inter,sans-serif;padding:13px 10px;text-decoration:none;cursor:pointer}
.fine{font-size:12.5px;text-align:center;margin:16px 0 0}

/* ===== 1 · Midnight premium ===== */
.v1 .box{position:relative;overflow:hidden;border-radius:32px;padding:34px 30px 26px;background:radial-gradient(60% 50% at 85% 0%,rgba(230,90,252,.35),transparent 70%),radial-gradient(50% 50% at 0% 100%,rgba(64,0,243,.45),transparent 70%),#170a2c;color:#fff;box-shadow:0 40px 90px -40px rgba(35,8,53,.8)}
.v1 td{border-bottom:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.9)}
.v1 td.l{color:rgba(255,255,255,.75)}
.v1 .l i.ic{background:rgba(255,255,255,.08)}.v1 .l i.ic svg{stroke:#c9b2ff}
.v1 .yes{color:#6ee7a0}.v1 .was{color:rgba(255,255,255,.45)}
.v1 .col{background:rgba(255,255,255,.07)}
.v1 thead .col{border-radius:22px 22px 0 0;box-shadow:inset 0 2px 0 rgba(255,255,255,.18)}
.v1 tbody tr:last-child .col{border-radius:0 0 22px 22px}
.v1 thead .col .pr{background:linear-gradient(90deg,#fff,#f0c6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.v1 .rec{background:var(--g);color:#fff;box-shadow:0 0 24px rgba(230,90,252,.6)}
.v1 .lim{background:rgba(255,120,170,.18);color:#ffb3cf}
.v1 .btn{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2)}.v1 .col .btn{background:var(--g);border:0;box-shadow:0 12px 30px -8px rgba(230,90,252,.6)}
.v1 .save td{color:#6ee7a0;font-weight:800}
.v1 .seg{background:rgba(255,255,255,.08)}.v1 .seg b{color:#fff}.v1 .seg b.on{background:#fff;color:#170a2c}
.v1 .fine{color:rgba(255,255,255,.55)}

/* ===== 1 light · Daylight premium ===== */
.v1l .box{position:relative;overflow:hidden;border-radius:32px;padding:34px 30px 26px;background:radial-gradient(55% 55% at 90% 0%,rgba(230,90,252,.22),transparent 70%),radial-gradient(50% 55% at 0% 100%,rgba(64,0,243,.16),transparent 70%),#fbf9ff;border:1px solid #ebe3fb;box-shadow:0 40px 90px -45px rgba(64,0,243,.45)}
.v1l td{border-bottom:1px solid #ece6f8;color:var(--ink)}
.v1l td.l{color:var(--mut)}
.v1l .l i.ic{background:#fff;box-shadow:0 4px 12px -4px rgba(64,0,243,.25)}.v1l .l i.ic svg{stroke:#6a2cff}
.v1l .yes{color:var(--ok)}.v1l .was{color:#9a8fb8}
.v1l .col{background:#fff}
.v1l thead .col{border-radius:22px 22px 0 0;box-shadow:0 -1px 0 #e2d6fb,-1px 0 0 #e2d6fb,1px 0 0 #e2d6fb}
.v1l tbody .col{box-shadow:-1px 0 0 #e2d6fb,1px 0 0 #e2d6fb}
.v1l tbody tr:last-child .col{border-radius:0 0 22px 22px;box-shadow:-1px 0 0 #e2d6fb,1px 0 0 #e2d6fb,0 1px 0 #e2d6fb,0 30px 50px -20px rgba(64,0,243,.35)}
.v1l thead .col .pr{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.v1l .rec{background:var(--g);color:#fff;box-shadow:0 0 22px rgba(230,90,252,.45)}
.v1l .lim{background:#ffe8f0;color:#b4235a}
.v1l .btn{background:#fff;color:#4b0fe0;border:1px solid #ddd0fa}.v1l .col .btn{background:var(--g);color:#fff;border:0;box-shadow:0 12px 30px -8px rgba(230,90,252,.55)}
.v1l .save td{color:var(--ok);font-weight:800}
.v1l .seg{background:#efe8fd}
.v1l .fine{color:var(--mut)}

.win{position:relative;padding:0 46px}
.win table{table-layout:fixed}.win td.l,.win th.l{width:30%}
.arw{position:absolute;top:58px;z-index:3;width:44px;height:44px;border-radius:50%;border:1px solid #ddd0fa;background:#fff;color:#4b0fe0;font:400 30px/1 Inter,sans-serif;cursor:pointer;box-shadow:0 10px 26px -10px rgba(64,0,243,.45);display:grid;place-items:center;padding-bottom:4px}
.arw.prev{left:0}.arw.next{right:0}
.arw:not([disabled]){animation:arP 1.8s ease-in-out infinite}.arw.prev:not([disabled]){animation-name:arPl}
.arw[disabled]{opacity:.3;cursor:default;box-shadow:none}
@keyframes arP{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}@keyframes arPl{0%,100%{transform:translateX(0)}50%{transform:translateX(-5px)}}
.sl{animation:slIn .35s ease}.sr{animation:srIn .35s ease}
@keyframes slIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}@keyframes srIn{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
.wdots{display:flex;justify-content:center;gap:7px;margin-top:14px}.wdots i{width:8px;height:8px;border-radius:50%;background:#ddd3f5}.wdots i.on{width:22px;border-radius:5px;background:var(--g)}

.cmp .box{padding:18px 26px 14px}
.cmp .seg{margin-bottom:6px}.cmp .seg b{padding:6px 14px;font-size:13px}
.cmp th{padding:8px 10px 10px}.cmp td{padding:6px 10px;font-size:14px}
.cmp .tag{font-size:10px;padding:3px 8px;margin-bottom:4px}.cmp .pn{font-size:16px}.cmp .was{font-size:12px}.cmp .pr{font-size:28px}
.cmp .l i.ic{width:24px;height:24px;border-radius:7px;margin-right:8px}.cmp .l i.ic svg{width:14px;height:14px}
.cmp .btn{padding:9px 8px;font-size:14px}.cmp .arw{top:38px;width:38px;height:38px;font-size:26px}
.cmp .save td{font-size:15px}.cmp .wdots{margin-top:8px}.cmp .fine{margin-top:8px;font-size:11.5px}
.cmp td.l{font-size:13.5px}

/* ===== 2 · Colour-coded plans ===== */
.v2 .box{border-radius:32px;padding:34px 30px 26px;background:#fff;border:1px solid var(--line);box-shadow:0 30px 70px -40px rgba(35,8,53,.35)}
.v2 thead th{padding:0 8px 18px;vertical-align:bottom}
.v2 .hd{border-radius:22px;padding:20px 12px 18px;color:#fff;position:relative}
.v2 .p0 .hd{background:linear-gradient(160deg,#a78bfa,#c4b5fd)}
.v2 .p1 .hd{background:linear-gradient(160deg,#7c3aed,#a855f7)}
.v2 .p2 .hd{background:linear-gradient(160deg,#4000f3,#e65afc);box-shadow:0 22px 50px -18px rgba(64,0,243,.65);transform:scale(1.06)}
.v2 .p3 .hd{background:linear-gradient(160deg,#230835,#5b1a7e)}
.v2 .hd .was{color:rgba(255,255,255,.7)}
.v2 .tag{background:#fff;color:#4b0fe0}.v2 .lim{background:#fff;color:#b4235a}
.v2 tbody tr:nth-child(odd) td{background:#faf8fe}
.v2 tbody td:first-child{border-radius:12px 0 0 12px}.v2 tbody td:last-child{border-radius:0 12px 12px 0}
.v2 td.l{color:var(--mut)}
.v2 .l i.ic{background:#f1ebff}.v2 .l i.ic svg{stroke:#5a1fe0}
.v2 .yes{color:var(--ok)}
.v2 .col{font-weight:800;color:#4b0fe0}
.v2 .save td{color:var(--ok);font-weight:800;font-size:17px}
.v2 .btn{background:#f1ebff;color:#4b0fe0}.v2 .col .btn,.v2 .p2c .btn{background:var(--g);color:#fff;box-shadow:0 12px 28px -10px rgba(64,0,243,.6)}
.v2 .fine{color:var(--mut)}

/* ===== 3 · Floating columns ===== */
.v3 .box{position:relative;border-radius:32px;padding:40px 26px 28px;background:radial-gradient(45% 60% at 100% 0%,#f3d9ff 0%,transparent 70%),radial-gradient(45% 60% at 0% 100%,#dcd2ff 0%,transparent 70%),#f4f0fb;overflow:hidden}
.v3 table{border-spacing:14px 0}
.v3 td,.v3 th{background:#fff}
.v3 td.l,.v3 th.l{background:transparent}
.v3 thead th{border-radius:24px 24px 0 0;padding-top:26px;box-shadow:0 -10px 30px -20px rgba(35,8,53,.25)}
.v3 thead th.l{box-shadow:none}
.v3 tbody tr:last-child td:not(.l){border-radius:0 0 24px 24px;padding-bottom:22px;box-shadow:0 26px 30px -26px rgba(35,8,53,.35)}
.v3 td:not(.l){border-bottom:1px dashed #eee8f8}
.v3 td.l{color:var(--mut);border-bottom:1px solid rgba(35,8,53,.06)}
.v3 .l i.ic{background:#fff;box-shadow:0 4px 12px -4px rgba(64,0,243,.25)}.v3 .l i.ic svg{stroke:#7a3cff}
.v3 th .bar{display:block;height:6px;border-radius:6px;margin:-12px auto 16px;width:46px;background:#e4dcf6}
.v3 .p2c{position:relative}
.v3 th.p2c{background:var(--g);color:#fff}
.v3 th.p2c .was{color:rgba(255,255,255,.7)}.v3 th.p2c .bar{background:rgba(255,255,255,.5)}
.v3 td.p2c{background:#fbf8ff;font-weight:700}
.v3 .rec{background:#fff;color:#4b0fe0}.v3 .lim{background:#ffe8f0;color:#b4235a}
.v3 .yes{color:var(--ok)}
.v3 .save td:not(.l){color:var(--ok);font-weight:800}
.v3 .btn{background:#f1ebff;color:#4b0fe0}.v3 td.p2c .btn{background:var(--g);color:#fff;box-shadow:0 12px 28px -10px rgba(64,0,243,.6)}
.v3 .fine{color:var(--mut)}

.seg{display:inline-flex;border-radius:999px;padding:5px;background:#f1ecfa;margin:0 auto 18px}.seg b{padding:9px 16px;border-radius:999px;font-size:14px}.seg b.on{background:var(--ink);color:#fff}
.cen{text-align:center}
.tip{display:inline-grid;place-items:center;width:16px;height:16px;margin-left:6px;border-radius:50%;border:1.5px solid currentColor;opacity:.55;font:800 10px/1 Georgia,serif;font-style:italic;vertical-align:1px}

/* ===== fit the whole table + buttons in one screen, scaled to the window height ===== */
.wrap{padding:clamp(8px,1.6vh,24px) 20px}
.opt{margin:0}
.v1l .box{padding:clamp(12px,2vh,30px) 26px clamp(10px,1.6vh,22px)}
.v1l .seg{margin-bottom:clamp(4px,1vh,16px)}.v1l .seg b{padding:clamp(6px,.9vh,9px) 16px;font-size:clamp(13px,1.6vh,14px)}
.v1l th{padding:clamp(6px,1vh,14px) 10px}
.v1l td{padding:clamp(5px,1.05vh,14px) 10px;font-size:clamp(14px,1.75vh,16px)}
.v1l td.l{font-size:clamp(13.5px,1.7vh,15.5px)}
.v1l .tag{font-size:clamp(10px,1.2vh,11px);padding:4px 9px;margin-bottom:clamp(3px,.6vh,8px)}
.v1l .pn{font-size:clamp(16px,2.1vh,20px)}.v1l .was{font-size:clamp(12px,1.5vh,14px)}.v1l .pr{font-size:clamp(28px,4.2vh,40px)}
.v1l .l i.ic{width:clamp(24px,3vh,30px);height:clamp(24px,3vh,30px)}.v1l .l i.ic svg{width:clamp(14px,1.8vh,17px);height:clamp(14px,1.8vh,17px)}
.v1l .btn{padding:clamp(9px,1.3vh,14px) 10px;font-size:clamp(14px,1.75vh,16px);max-width:210px}
.v1l .arw{top:clamp(34px,5vh,60px)}
.v1l .save td{font-size:clamp(15px,1.95vh,18px)}
.wdots{margin-top:clamp(6px,1vh,14px)}.v1l .fine{margin-top:clamp(6px,1vh,14px)}
.pr.cons{font-size:clamp(22px,3.2vh,30px)!important}

/* ===== phones: the locked mobile plan card ===== */
.bm{display:none}
@media(max-width:760px){.bm{display:block}
 .bm-tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}
 .bm-tabs button{flex:1 1 0;min-width:0;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px 2px;font:800 13px Inter,sans-serif;color:var(--ink);cursor:pointer;line-height:1.2}
 .bm-tabs button small{display:block;font-size:10.5px;font-weight:700;color:var(--mut)}
 .bm-tabs button.on{background:var(--g);color:#fff;border-color:transparent}.bm-tabs button.on small{color:rgba(255,255,255,.85)}
 .bm-card{border:3px solid transparent;background:linear-gradient(#fff,#fff) padding-box,var(--g) border-box;border-radius:24px;padding:22px 18px;box-shadow:0 20px 50px -20px rgba(64,0,243,.4)}
 .bm-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
 .bm-h h3{margin:0;font-size:24px}.bm-h .rb{margin:0 0 6px}
 .bm-p{text-align:right}.bm-p s{color:#9a8fb8;font-size:14px}.bm-p b{display:block;font-size:32px;letter-spacing:-.02em;line-height:1.05}.bm-p small{font-size:12px;color:var(--mut)}
 .bm-save{display:inline-block;margin:12px 0 4px;font-size:14px;font-weight:800;color:var(--ok);background:#e9f9ef;border-radius:999px;padding:6px 12px}
 .bm-rows{list-style:none;margin:10px 0 18px;padding:0}
 .bm-rows li{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
 .bm-rows li span:first-child{color:var(--mut)}.bm-rows li span:last-child{font-weight:700;text-align:right}
 .bm-rows .yes{color:var(--ok)}
 .bm-hint{text-align:center;font-size:13px;color:var(--mut);margin:12px 0 0}}
.bm-dots{display:flex;justify-content:center;gap:7px;margin:12px 0 0}.bm-dots i{width:8px;height:8px;border-radius:50%;background:#ddd3f5}.bm-dots i.on{width:22px;border-radius:5px;background:var(--g)}
@media(max-width:760px){.tabs{position:static}
 .bm-tabs{scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;margin:0 -14px;padding:4px 14px 12px!important}
 .bm-tabs::-webkit-scrollbar{display:none}
 .bm-tabs button{flex:0 0 auto!important;min-width:84px!important;scroll-snap-align:center;padding:8px 14px!important;border-radius:999px!important;font-size:13.5px!important}
 .bm-tabs button small{display:inline!important;margin-left:4px;font-size:11.5px!important}
 .bm-card{touch-action:pan-y;transition:transform .25s,opacity .25s}.bm-card.out{opacity:.2}}
.lim{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#b4235a;background:#ffe8f0;border-radius:999px;padding:4px 9px;margin-bottom:6px;white-space:nowrap}
.bm-card{position:relative}
.bm-swipe{display:none;position:absolute;left:50%;top:44%;z-index:3;transform:translate(-50%,-50%);flex-direction:column;align-items:center;gap:6px;pointer-events:none;background:rgba(35,8,53,.82);color:#fff;border-radius:22px;padding:16px 22px;font-size:14px;letter-spacing:.08em;text-transform:uppercase;box-shadow:0 16px 40px rgba(35,8,53,.35);opacity:0}
.bm-hand svg{width:38px;height:38px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.bm-card.nudge{animation:bmNudge 2.6s ease-in-out 2}
.bm-card.nudge .bm-swipe{display:flex;animation:bmShow 5.2s ease forwards}
.bm-card.nudge .bm-hand{animation:bmHand 1.3s ease-in-out 4}
@keyframes bmNudge{0%,100%{transform:translateX(0)}20%{transform:translateX(-38px)}40%{transform:translateX(0)}60%{transform:translateX(26px)}80%{transform:translateX(0)}}
@keyframes bmHand{0%,100%{transform:translateX(18px)}50%{transform:translateX(-18px)}}
@keyframes bmShow{0%{opacity:0}8%,85%{opacity:1}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.bm-card.nudge,.bm-card.nudge .bm-hand{animation:none}}
.tip{display:inline-grid;place-items:center;width:17px;height:17px;margin-left:6px;border-radius:50%;border:1.5px solid #b9a6ec;background:#fff;color:#6a2cff;font:800 11px/1 Georgia,serif;font-style:italic;cursor:pointer;vertical-align:1px;padding:0}
.tipbox{position:absolute;z-index:50;max-width:260px;background:#230835;color:#fff;font-size:13.5px;line-height:1.45;border-radius:14px;padding:12px 14px;box-shadow:0 16px 40px rgba(35,8,53,.35)}
.tipbox:after{content:"";position:absolute;left:var(--ax,20px);top:-6px;width:12px;height:12px;background:#230835;transform:rotate(45deg)}
@media(max-width:760px){.win,.wdots,.v1l .box>.fine{display:none!important}.v1l .box{padding:18px 14px 20px}.wrap{padding:12px 14px}
 .rb{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.1em;color:#fff;background:var(--g);border-radius:999px;padding:5px 10px}
 .bm .btn{max-width:none;background:var(--g);color:#fff;padding:15px;font-size:16px;box-shadow:0 14px 30px -12px rgba(64,0,243,.55)}
 .bm-fine{font-size:12px;color:var(--mut);text-align:center;margin:12px 0 0;line-height:1.5}}

</style>
</head>
<body>
<div class="wrap">
  <section class="opt v1l" id="s1l"><div class="box"><div class="cen"><div class="seg"><b class="on">Consumers (B2C)</b><b>Business owners (B2B)</b></div></div><div class="win"><button type="button" class="arw prev" aria-label="Previous plans">&#8249;</button><table id="T1L"></table><button type="button" class="arw next" aria-label="More plans">&#8250;</button></div><div class="wdots" id="T1Ld"></div><div class="bm" id="BM"></div><p class="fine">Prices in CAD + tax · Prepaid · $0 monthly · *Estimated distribution is an estimate, not a guarantee</p></div></section>
